<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>I Wanna Be A Purparent</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Registration Section -->
    <div class="container" id="registrationContainer">

        <h1>I Wanna Be A Purparent</h1>
        <p class="subtitle">Create your account</p>

        <form id="registrationForm">

            <!-- Full Name -->
            <label for="fullName">Full Name</label>
            <input 
                type="text" 
                id="fullName" 
                placeholder="Enter your full name"
            >

            <!-- Email -->
            <label for="email">Email Address</label>
            <input 
                type="email" 
                id="email" 
                placeholder="Enter your email address"
            >

            <!-- Password -->
            <label for="password">Password</label>
            <input 
                type="password" 
                id="password" 
                placeholder="Enter your password"
            >

            <button type="submit" id="registerButton">
                Register
            </button>

            <!-- Message -->
            <p id="message"></p>

        </form>

    </div>


    <!-- Loading Indicator -->
    <div class="loading-box" id="loadingBox">

        <div class="spinner"></div>

        <p>Preparing your purbaby list...</p>

    </div>


    <!-- Adoption Section -->
    <div class="container adoption-container" id="adoptionContainer">

        <h1>Choose your purbaby</h1>

        <p class="subtitle">
            Find a furry friend to welcome home.
        </p>


        <!-- Scrollable Pet List -->
        <div class="pet-list">

            <!-- Cat 1 -->
            <div class="pet-card" data-pet="Milo">

                <img 
                    src="https://placecats.com/120/120" 
                    alt="Milo the cat"
                >

                <div class="pet-info">
                    <h3>Milo</h3>
                    <p>2 years old</p>
                    <span>Cat</span>
                </div>

            </div>


            <!-- Dog 1 -->
            <div class="pet-card" data-pet="Buddy">

                <img 
                    src="https://placedog.net/120/120?id=1" 
                    alt="Buddy the dog"
                >

                <div class="pet-info">
                    <h3>Buddy</h3>
                    <p>3 years old</p>
                    <span>Dog</span>
                </div>

            </div>


            <!-- Cat 2 -->
            <div class="pet-card" data-pet="Luna">

                <img 
                    src="https://placecats.com/121/121" 
                    alt="Luna the cat"
                >

                <div class="pet-info">
                    <h3>Luna</h3>
                    <p>1 year old</p>
                    <span>Cat</span>
                </div>

            </div>


            <!-- Dog 2 -->
            <div class="pet-card" data-pet="Max">

                <img 
                    src="https://placedog.net/121/121?id=2" 
                    alt="Max the dog"
                >

                <div class="pet-info">
                    <h3>Max</h3>
                    <p>4 years old</p>
                    <span>Dog</span>
                </div>

            </div>


            <!-- Cat 3 -->
            <div class="pet-card" data-pet="Coco">

                <img 
                    src="https://placecats.com/122/122" 
                    alt="Coco the cat"
                >

                <div class="pet-info">
                    <h3>Coco</h3>
                    <p>2 years old</p>
                    <span>Cat</span>
                </div>

            </div>


            <!-- Dog 3 -->
            <div class="pet-card" data-pet="Charlie">

                <img 
                    src="https://placedog.net/122/122?id=3" 
                    alt="Charlie the dog"
                >

                <div class="pet-info">
                    <h3>Charlie</h3>
                    <p>1 year old</p>
                    <span>Dog</span>
                </div>

            </div>

        </div>


        <!-- Selected Pet -->
        <p id="selectedPet"></p>

    </div>


    <script src="script.js"></script>

</body>
</html>
