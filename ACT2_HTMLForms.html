<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Forms</title> 

    <style>
        body{
            background-color: rgb(118, 106, 197);
        }

        .container{
            width:500px;
            margin:30px auto;
            padding:25px;
            background:rgb(159, 179, 230);
            border:2px solid #4CAF50;
            border-radius:15px;
            box-shadow:0px 0px 10px gray;
        }

        h1, p{
            text-align:center;
        }
        
        .title{
        color: rgb(218, 218, 230);
}
    </style>
</head>

    <body>

    <div class="title">
        <center>
            <h1>Welcome to Tin's Feedback Space</h1>
            <h4><i>"Your safe space to yap..."</i></h4>
        </center>
    </div>

    <div class="container">
        <form action="submit.php" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

         <label for="phone">Phone:</label>
        <input type="phone" id="phone" name="phone" required><br><br>

        <label for="bibliography">Comment:</label><br>
        <textarea id="bibliography" name="bibliography" rows="10" cols="50" required></textarea><br><br>
        
         <label>Skills:</label><br>
        <input type="checkbox" id="hardware" name="skills" value="HARDWARE">
        <label for="html">Hardware Professional</label><br>

        <input type="checkbox" id="software" name="skills" value="SOFTWARE">
        <label for="css">Software Specialist</label><br>

        <input type="checkbox" id="programming" name="skills" value="PROGRAMMING">
        <label for="css">Full-stack Programmer</label><br>

        <input type="checkbox" id="programming" name="skills" value="PROGRAMMING">
        <label for="css">Back-end Programmer</label><br>

        <input type="checkbox" id="programming" name="skills" value="PROGRAMMING">
        <label for="css">Front-end Programmer</label><br>

        <input type="checkbox" id="engineering" name="skills" value="ENGINEERING">
        <label for="javascript">Software Engineering</label><br><br>

        <label>Preferred Contact Method:</label><br>

        <input type="radio" id="phone" name="contact" value="Phone" required>
        <label for="phone">Phone</label><br>

        <input type="radio" id="emailContact" name="contact" value="Email">
        <label for="emailContact">Email</label><br>

        <input type="radio" id="emailContact" name="contact" value="Email">
        <label for="emailContact">Instagram</label><br><br>

        <label for="country">Country:</label>

        <select id="country" name="country" required>
            <option value="">--Select Country--</option>
            <option>Philippines</option>
            <option>Japan</option>
            <option>South Korea</option>
            <option>Canada</option>
            <option>Australia</option>
        </select>

        <br><br>

            <label for="profile">Profile Picture:</label>

        <input type="file" id="profile" name="profile">

        <br><br>
        <center>

        <input type="submit" value="Submit">
        <input type="reset" value="Clear">

        </center>

            
        </form>
    </div>


    </body>
</html>
